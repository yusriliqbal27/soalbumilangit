<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Soal Online</title>
<style>
  :root{--bg:#f4f6fb;--card:#fff;--tx:#1d2433;--mut:#667089;--pri:#3b5bdb;--ok:#2b8a3e;--bad:#c92a2a;--bd:#dde2ee}
  @media (prefers-color-scheme:dark){:root{--bg:#12151d;--card:#1b2030;--tx:#e8ebf4;--mut:#9aa3ba;--pri:#748ffc;--ok:#69db7c;--bad:#ff8787;--bd:#2c3348}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  .wrap{max-width:760px;margin:0 auto;padding:16px}
  .card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:18px;margin-bottom:14px}
  h1{font-size:1.4rem;margin:0 0 4px} h2{font-size:1.1rem;margin:0 0 8px}
  .mut{color:var(--mut);font-size:.92rem}
  input[type=text],textarea{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
  textarea{min-height:90px;resize:vertical}
  label.f{display:block;margin:10px 0 4px;font-weight:600;font-size:.92rem}
  button{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:10px 18px;background:var(--pri);color:#fff;font-weight:600}
  button.sec{background:transparent;color:var(--pri);border:1px solid var(--pri)}
  button:disabled{opacity:.5;cursor:not-allowed}
  .tabs{display:flex;gap:8px;margin-bottom:14px}
  .tabs button{flex:1;background:var(--card);color:var(--tx);border:1px solid var(--bd)}
  .tabs button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
  .q .qt{margin:0 0 10px}
  .q img{max-width:100%;border-radius:8px;margin:0 0 10px}
  .opt{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border:1px solid var(--bd);border-radius:8px;margin-bottom:6px;cursor:pointer}
  .opt:hover{border-color:var(--pri)}
  .opt input{margin-top:5px}
  .opt.sel{border-color:var(--pri);background:color-mix(in srgb,var(--pri) 10%,transparent)}
  .opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent)}
  .opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,transparent)}
  .bar{position:sticky;top:0;z-index:5;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 16px;margin-bottom:14px;display:flex;justify-content:space-between;gap:10px;align-items:center}
  .bar b{font-variant-numeric:tabular-nums}
  .err{color:var(--bad);margin:8px 0 0;font-size:.95rem}
  .score{font-size:3rem;font-weight:800;color:var(--pri);line-height:1}
  .bahas{margin-top:8px;font-size:.92rem;color:var(--mut)}
  .hide{display:none!important}
</style>
</head>
<body>
<div class="wrap">

  <!-- BERANDA -->
  <section id="home">
    <div class="card">
      <h1 id="judul">Memuat…</h1>
      <div class="mut" id="petunjuk"></div>
      <div id="statusMsg" class="err hide"></div>
    </div>
    <div class="tabs">
      <button id="tabMulai" class="on">Kerjakan Soal</button>
      <button id="tabHasil">Cek Hasil</button>
    </div>

    <div id="paneMulai" class="card">
      <label class="f" for="nama">Nama lengkap</label>
      <input type="text" id="nama" autocomplete="name">
      <label class="f" for="nis">NIS / No. Absen / Kelas (harus unik)</label>
      <input type="text" id="nis">
      <p class="err hide" id="errMulai"></p>
      <p><button id="btnMulai" disabled>Mulai</button></p>
    </div>

    <div id="paneHasil" class="card hide">
      <label class="f" for="nisCek">NIS / No. Absen / Kelas yang kamu isi saat mengerjakan</label>
      <input type="text" id="nisCek">
      <p class="err hide" id="errHasil"></p>
      <p><button id="btnCek">Lihat Hasil</button></p>
      <div id="hasilOut"></div>
    </div>
  </section>

  <!-- UJIAN -->
  <section id="exam" class="hide">
    <div class="bar"><div>Terjawab: <b id="cnt">0</b>/<span id="tot">0</span></div><div id="timerBox" class="hide">Sisa waktu: <b id="timer"></b></div></div>
    <div id="qs"></div>
    <div class="card">
      <p class="err hide" id="errKirim"></p>
      <button id="btnKirim">Kumpulkan Jawaban</button>
    </div>
  </section>

  <!-- SELESAI -->
  <section id="done" class="hide">
    <div class="card">
      <h1>Jawaban terkirim ✔</h1>
      <p>Terima kasih, <b id="doneNama"></b>. Jawabanmu sudah tersimpan.</p>
      <p class="mut">Nilai dan pembahasan akan dibuka oleh guru. Nanti cek lewat tab <b>Cek Hasil</b> dengan NIS yang sama.</p>
    </div>
  </section>

</div>

<script src="config.js"></script>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ls = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
async function apiGet(params){
  const r = await fetch(API_URL + '?' + new URLSearchParams(params));
  return r.json();
}
async function apiPost(body){
  const r = await fetch(API_URL, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(body)});
  return r.json();
}
function show(id){ ['home','exam','done'].forEach(x => $('#'+x).classList.toggle('hide', x!==id)); window.scrollTo(0,0); }
function showErr(sel,msg){ const e=$(sel); e.textContent=msg||''; e.classList.toggle('hide',!msg); }

/* acak yang konsisten per siswa (refresh tidak mengubah urutan) */
function hash(str){ let h=2166136261; for(const c of str){ h^=c.charCodeAt(0); h=Math.imul(h,16777619);} return h>>>0; }
function rng(seed){ return function(){ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function shuffle(arr,r){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(r()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

let CFG = null, ME = {nama:'', nis:''}, ANS = {}, TIMER = null, START = 0;

/* ---------- Beranda ---------- */
(async function init(){
  if (!API_URL || API_URL.startsWith('PASTE')) { $('#judul').textContent='Belum dikonfigurasi'; showErr('#statusMsg','Isi API_URL di config.js dulu.'); return; }
  try {
    CFG = await apiGet({action:'soal'});
    if (!CFG.ok) throw new Error(CFG.error);
    document.title = CFG.judul;
    $('#judul').textContent = CFG.judul;
    $('#petunjuk').textContent = CFG.petunjuk;
    if (!CFG.buka) showErr('#statusMsg','Ujian sedang ditutup. Kamu masih bisa cek hasil jika sudah mengumpulkan.');
    $('#btnMulai').disabled = !CFG.buka;
  } catch(e){ $('#judul').textContent='Gagal memuat'; showErr('#statusMsg', 'Tidak bisa terhubung ke server: ' + e.message); }
})();

$('#tabMulai').onclick = () => setTab(true);
$('#tabHasil').onclick = () => setTab(false);
function setTab(mulai){
  $('#tabMulai').classList.toggle('on',mulai); $('#tabHasil').classList.toggle('on',!mulai);
  $('#paneMulai').classList.toggle('hide',!mulai); $('#paneHasil').classList.toggle('hide',mulai);
}

/* ---------- Mulai ujian ---------- */
$('#btnMulai').onclick = async () => {
  const nama = $('#nama').value.trim(), nis = $('#nis').value.trim();
  if (!nama || !nis) return showErr('#errMulai','Nama dan NIS wajib diisi.');
  showErr('#errMulai','');
  $('#btnMulai').disabled = true; $('#btnMulai').textContent = 'Memuat soal…';
  try {
    const cek = await apiGet({action:'hasil', id:nis});
    if (cek.ok) { showErr('#errMulai','NIS ini sudah mengumpulkan jawaban. Pakai tab Cek Hasil.'); return; }
    const d = await apiGet({action:'soal'});
    if (!d.buka || !d.soal.length) { showErr('#errMulai','Ujian ditutup atau belum ada soal.'); return; }
    CFG = d; ME = {nama, nis};
    startExam();
  } catch(e){ showErr('#errMulai','Gagal: '+e.message); }
  finally { $('#btnMulai').disabled = !(CFG && CFG.buka); $('#btnMulai').textContent = 'Mulai'; }
};

function startExam(){
  const key = 'ujian:' + ME.nis;
  try { ANS = JSON.parse(ls.get(key+':jaw') || '{}'); } catch(e){ ANS = {}; }
  const seed = hash(ME.nis + '|' + CFG.judul);
  const r = rng(seed);
  const list = CFG.acak ? shuffle(CFG.soal, r) : CFG.soal;
  const box = $('#qs'); box.innerHTML = '';
  list.forEach((q,i) => {
    const el = document.createElement('div'); el.className = 'card q';
    let h = `<p class="qt"><b>${i+1}.</b> ${esc(q.soal)}</p>`;
    if (/^https:\/\//.test(q.gambar||'')) h += `<img src="${esc(q.gambar)}" alt="">`;
    if (q.esai) {
      h += `<textarea data-q="${q.id}" placeholder="Tulis jawabanmu…">${esc(ANS[q.id]||'')}</textarea>`;
    } else {
      const keys = Object.keys(q.opsi);
      const order = CFG.acak ? shuffle(keys, rng(seed + q.id)) : keys;
      order.forEach((k,j) => {
        h += `<label class="opt${ANS[q.id]===k?' sel':''}"><input type="radio" name="q${q.id}" value="${k}" data-q="${q.id}"${ANS[q.id]===k?' checked':''}><span><b>${'ABCDE'[j]}.</b> ${esc(q.opsi[k])}</span></label>`;
      });
    }
    el.innerHTML = h; box.appendChild(el);
  });
  $('#tot').textContent = list.length; updCount();
  box.oninput = box.onchange = ev => {
    const t = ev.target, q = t.dataset.q; if (!q) return;
    ANS[q] = t.value;
    if (t.type === 'radio') t.closest('.q').querySelectorAll('.opt').forEach(o => o.classList.toggle('sel', o.contains(t) && t.checked));
    ls.set(key+':jaw', JSON.stringify(ANS)); updCount();
  };
  // timer
  clearInterval(TIMER);
  START = Number(ls.get(key+':start')) || Date.now(); ls.set(key+':start', START);
  if (CFG.durasi > 0) {
    $('#timerBox').classList.remove('hide');
    const end = START + CFG.durasi*60000;
    const tick = () => {
      const left = Math.max(0, end - Date.now()), m = Math.floor(left/60000), s = Math.floor(left%60000/1000);
      $('#timer').textContent = m + ':' + String(s).padStart(2,'0');
      if (left <= 0) { clearInterval(TIMER); kirim(true); }
    };
    tick(); TIMER = setInterval(tick, 1000);
  } else $('#timerBox').classList.add('hide');
  show('exam');
}
function updCount(){ $('#cnt').textContent = Object.values(ANS).filter(v => String(v).trim() !== '').length; }

/* ---------- Kirim ---------- */
$('#btnKirim').onclick = () => kirim(false);
let sending = false;
async function kirim(auto){
  if (sending) return;
  const kosong = $('#tot').textContent - $('#cnt').textContent;
  if (!auto && kosong > 0 && !confirm(kosong + ' soal belum dijawab. Tetap kumpulkan?')) return;
  if (!auto && kosong === 0 && !confirm('Kumpulkan jawaban sekarang? Tidak bisa diubah lagi.')) return;
  sending = true; $('#btnKirim').disabled = true; $('#btnKirim').textContent = 'Mengirim…'; showErr('#errKirim','');
  try {
    const res = await apiPost({action:'submit', nama:ME.nama, id:ME.nis, jawaban:ANS, durasi:Math.round((Date.now()-START)/1000)});
    if (!res.ok) throw new Error(res.error);
    clearInterval(TIMER);
    ['jaw','start'].forEach(k => ls.del('ujian:'+ME.nis+':'+k));
    $('#doneNama').textContent = ME.nama; show('done');
  } catch(e){
    showErr('#errKirim','Gagal mengirim: '+e.message+'. Jawabanmu masih aman di perangkat ini, coba lagi.');
    $('#btnKirim').disabled = false; $('#btnKirim').textContent = 'Kumpulkan Jawaban';
  } finally { sending = false; }
}
window.addEventListener('beforeunload', e => { if (!$('#exam').classList.contains('hide')) { e.preventDefault(); e.returnValue=''; } });

/* ---------- Cek hasil ---------- */
$('#btnCek').onclick = async () => {
  const id = $('#nisCek').value.trim(); showErr('#errHasil',''); $('#hasilOut').innerHTML='';
  if (!id) return showErr('#errHasil','Isi NIS dulu.');
  $('#btnCek').disabled = true;
  try {
    const d = await apiGet({action:'hasil', id});
    if (!d.ok) return showErr('#errHasil', d.error);
    let h = `<h2>${esc(d.nama)}</h2>`;
    if (d.nilaiTampil) h += `<div class="score">${esc(d.skor)}</div><p class="mut">Benar ${esc(d.benar)} dari ${esc(d.totalPG)} soal pilihan ganda</p>`;
    else h += `<p>Jawabanmu sudah tercatat. Nilai belum dibuka oleh guru.</p>`;
    if (!d.kunciTampil && d.nilaiTampil) h += `<p class="mut">Kunci jawaban belum dibuka.</p>`;
    if (d.review) h += d.review.map((q,i) => reviewHtml(q,i)).join('');
    $('#hasilOut').innerHTML = h;
  } catch(e){ showErr('#errHasil','Gagal: '+e.message); }
  finally { $('#btnCek').disabled = false; }
};
function reviewHtml(q,i){
  let h = `<div class="q" style="margin-top:16px"><p class="qt"><b>${i+1}.</b> ${esc(q.soal)}</p>`;
  if (q.esai) {
    h += `<div class="opt"><span>Jawabanmu: ${esc(q.jawabanmu) || '<i>(kosong)</i>'}</span></div>`;
  } else {
    Object.keys(q.opsi).forEach(k => {
      const cls = k===q.kunci ? 'right' : (k===q.jawabanmu ? 'wrong' : '');
      const tag = k===q.kunci ? ' ✔ kunci' : (k===q.jawabanmu ? ' ✘ jawabanmu' : '');
      h += `<div class="opt ${cls}"><span><b>${k}.</b> ${esc(q.opsi[k])}${tag}</span></div>`;
    });
    if (!q.jawabanmu) h += `<p class="mut">Tidak dijawab.</p>`;
  }
  if (q.bahas) h += `<div class="bahas">Pembahasan: ${esc(q.bahas)}</div>`;
  return h + '</div>';
}
</script>
</body>
</html>
